<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | IIMS Registrar</title>

                        "on-surface": "#0b1c30",
                        "error-container": "#ffdad6",
                        "secondary": "#515f74",
                        "tertiary-container": "#384055",

<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9ff;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .signature-cta {
            background: linear-gradient(135deg, #0b1a7d 0%, #283593 100%);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col antialiased">
<!-- TopAppBar for Branding Context (Suppressing active nav as per shell rules for login) -->
<header class="bg-indigo-50/80 backdrop-blur-xl shadow-sm fixed top-0 w-full z-50 flex justify-between items-center px-8 py-3">
<div class="flex items-center gap-2">
<span class="text-xl font-bold tracking-tighter text-indigo-900">IIMS Registrar</span>
</div>
<div class="flex gap-4">
<span class="material-symbols-outlined text-indigo-900 cursor-pointer" data-icon="help_outline">help_outline</span>
</div>
</header>
<main class="flex-grow flex items-center justify-center pt-16 px-6">
<!-- Visual Anchor Background Element -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[20%] -right-[10%] w-[600px] h-[600px] bg-surface-container-high rounded-full blur-[120px] opacity-40"></div>
<div class="absolute -bottom-[20%] -left-[10%] w-[600px] h-[600px] bg-secondary-container rounded-full blur-[120px] opacity-30"></div>
</div>
<!-- Login Container -->
<div class="relative w-full max-w-md">
<div class="glass-card bg-surface-container-lowest/90 rounded-xl p-10 shadow-[0_24px_48px_-12px_rgba(11,28,48,0.08)]">
<!-- Branding & Identity -->
<div class="mb-10 text-center">
<div class="inline-flex items-center justify-center w-16 h-16 bg-surface-container rounded-full mb-6">
<span class="material-symbols-outlined text-primary text-3xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<h1 class="text-2xl font-bold text-on-surface tracking-tight mb-2">Institutional Clarity</h1>
<p class="text-on-surface-variant text-sm font-medium tracking-wide">Enter your credentials to access the Registrar Portal</p>
</div>
<!-- Form -->
<form class="space-y-6">
<div>
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-2 ml-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg" data-icon="mail">mail</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-surface-container-low border-none rounded-lg text-on-surface placeholder-outline focus:ring-2 focus:ring-primary-fixed-dim transition-all text-sm font-medium" id="email" name="email" placeholder="name@institution.edu" required="" type="email"/>
</div>
</div>
<div>
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-2 ml-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg" data-icon="lock">lock</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-surface-container-low border-none rounded-lg text-on-surface placeholder-outline focus:ring-2 focus:ring-primary-fixed-dim transition-all text-sm font-medium" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-center justify-between px-1">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary-fixed border-outline-variant rounded" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-sm text-on-surface-variant font-medium" for="remember-me">Remember me</label>
</div>
<a class="text-sm font-semibold text-primary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<button class="signature-cta w-full py-4 px-6 rounded-lg text-on-primary font-bold tracking-tight shadow-lg active:scale-[0.98] transition-transform duration-200" type="submit">
                        Login to Dashboard
                    </button>
</form>
<!-- Footer Links -->
<div class="mt-10 pt-8 border-t border-outline-variant/15 text-center">
<p class="text-sm text-on-surface-variant font-medium">
                        Don't have an administrative account?
                        <a class="text-primary font-bold ml-1 hover:underline" href="#">Request access</a>
</p>
</div>
</div>
<!-- System Info -->
<div class="mt-8 flex justify-center items-center gap-6 text-outline text-[10px] font-bold uppercase tracking-widest">
<span class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-xs" data-icon="verified_user">verified_user</span>
                    Secure Session
                </span>
<span class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-xs" data-icon="update">update</span>
                    v4.2.0-STABLE
                </span>
</div>
</div>
</main>
<!-- Visual Polish: Content Canvas Image (Subtle Editorial Feel) -->
<div class="fixed bottom-0 right-0 p-8 hidden lg:block opacity-10 grayscale hover:opacity-30 transition-opacity duration-700">
<img alt="Institutional Seal Detail" class="w-48 h-48 object-contain" data-alt="A refined, architectural close-up of a university library facade with classic stone pillars and soft evening lighting, professional aesthetic" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCjmMQwkfaqoJqSWQtI0WXrPWC-jednfmKKPackXQ4VIJOEDqv3amqRTtu-ffz0p4yQmjLMqa9blDSy7DvQOQpOVfJ9H8A-okpZURIP3XHtovRTcsAMNSoJuDVwrbIiyr666BJDqJ3G3DSrWdsSSosJ1_rJb519xVuLP2Wa_4DQwh8CadunkvIwpbTP0UAbNQ9zQlYqM3XgqMI_wZYJDxzNR5OUY-OQzgB1SupaB_WiCTvrLa1Nb86sufzhgUMbxqhq0yMpHqe-5DwG"/>
</div>
</body></html>
